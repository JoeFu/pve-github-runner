name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck pve-install.sh runner-setup.sh
      - name: Syntax
        run: bash -n pve-install.sh && bash -n runner-setup.sh
